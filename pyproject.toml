[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairness-audit"
version = "0.1.0"
description = "Fairness audit microservice for EnergyGuard (Horizon Europe GA 101172705)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "fairlearn>=0.10",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "jsonschema>=4.22",
]

[tool.hatch.build.targets.wheel]
# runner and app are importable after `pip install .`
packages = ["fairness-backend/runner", "fairness-backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Allows `import runner` and `import app` without installing
pythonpath = ["fairness-backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = [
    "ANN101",  # missing type annotation for `self`
    "ANN102",  # missing type annotation for `cls`
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "fairness-backend"
