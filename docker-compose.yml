# Local development stack.
# Mirrors the robustness-service docker-compose pattern (Alex Tzortzis).
# Port assignments (avoids collision when both services run on same dev machine):
#   9006 — fairness-audit API
#   9007 — fairness-mlflow UI

services:
  fairness-audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: energyguard/fairness-audit:dev
    ports:
      - "9006:9006"
    environment:
      MLFLOW_TRACKING_URI: http://fairness-mlflow:5000
    volumes:
      - ./runs:/app/runs
    depends_on:
      - fairness-mlflow
    restart: unless-stopped

  # MLflow tracking server. v1 services do not log to it yet.
  # Reserved for v1.1 MLflow model loader (T5.2 integration).
  fairness-mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "9007:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlflow_store:/mlflow
    restart: unless-stopped

volumes:
  {}
